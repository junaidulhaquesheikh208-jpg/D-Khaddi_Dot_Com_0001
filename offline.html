<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You are offline - Khaadi</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            background-color: #f8f8f8;
            color: #333;
            margin: 0;
        }
        
        .container {
            max-width: 600px;
            padding: 2rem;
        }
        
        h1 {
            color: #d4af37;
            margin-bottom: 1rem;
        }
        
        p {
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }
        
        .retry-btn {
            background-color: #d4af37;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .retry-btn:hover {
            background-color: #b8941f;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1> offline</h1>
        <p>We noticed you're not connected to the internet. Please check your connection and try again.</p>
        <button class="retry-btn" onclick="window.location.reload()">Try Again</button>
    </div>
</body>
</html>
